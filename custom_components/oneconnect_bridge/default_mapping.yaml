# 这是每个网关首次添加时复制到其 .storage 目录的样品配置。
#
# 默认开启。首次复制后会加载预置子设备模型；如需暂不注册，可将 enabled 改为 false。
# identity、SN、UDID、devId 和认证材料由运行时生成并持久化，不写入这里。
# 关键字段：
# schema: 固定为 1；enabled: false 不加载，true 才编译并注册子设备。
# gateway_serial: 网关上下文记录，可留空；文件所在的网关目录才是实际隔离边界。
# children.<key>: 子设备稳定键；display.friendly_name/room 为云端显示名称和房间。
# lifecycle.on_product_change: block 阻止换型，replace 注册新模型后删除旧子设备。
# product.ref: 必须引用 catalog.yaml 中的产品；services 用 st/sid 选择华为服务。
# bindings: 将 HA 实体字段绑定到华为服务字段；sid 必须对应 services 中的 sid。
# source 可为 state、attribute、constant、command；attribute 使用 attribute，constant 使用 value。
# entity_id 指 HA 实体；component 仅支持 red、green、blue；两个 *_to_* 字段声明值转换。

schema: 1
enabled: true
gateway_serial: ""

children:
  oslo_one_key_switch:
    lifecycle:
      on_product_change: block
    display:
      friendly_name: "奥斯陆一键开关"
      room: "厨房"

    product:
      ref: ZG2R
      services:
        - st: switch
          sid: switch1

    bindings:
      - sid: switch1
        fields:
          "on":
            entity_id: switch.REPLACE_WITH_KITCHEN_SWITCH
            source: state
            ha_to_huawei:
              type: state_map
              map:
                "on": 1
                "off": 0
            huawei_to_ha:
              type: state_map
              map:
                "0": "off"
                "1": "on"

  monochrome_ceiling_lamp:
    lifecycle:
      on_product_change: block
    display:
      friendly_name: "华为智能吸顶灯（单色）"
      room: "卧室"

    product:
      ref: ZG0Y
      services:
        - st: switch
          sid: switch

    bindings:
      - sid: switch
        fields:
          "on":
            entity_id: light.REPLACE_WITH_CEILING_LAMP
            source: state
            ha_to_huawei:
              type: state_map
              map:
                "on": 1
                "off": 0
            huawei_to_ha:
              type: state_map
              map:
                "0": "off"
                "1": "on"

  dimmable_lamp:
    lifecycle:
      on_product_change: block
    display:
      friendly_name: "华为调光智能灯"
      room: "书房"

    product:
      ref: ZG14
      services:
        - st: switch
          sid: switch
        - st: brightness
          sid: brightness

    bindings:
      - sid: switch
        fields:
          "on":
            entity_id: light.REPLACE_WITH_DIMMABLE_LAMP
            source: state
            ha_to_huawei:
              type: state_map
              map:
                "on": 1
                "off": 0
            huawei_to_ha:
              type: state_map
              map:
                "0": "off"
                "1": "on"

      - sid: brightness
        fields:
          brightness:
            entity_id: light.REPLACE_WITH_DIMMABLE_LAMP
            source: attribute
            attribute: brightness

  color_ceiling_lamp:
    lifecycle:
      on_product_change: block
    display:
      friendly_name: "华为调光调色吸顶灯"
      room: "餐厅"

    product:
      ref: ZG2I
      services:
        - st: switch
          sid: switch
        - st: brightness
          sid: brightness
        - st: cct
          sid: cct

    bindings:
      - sid: switch
        fields:
          "on":
            entity_id: light.REPLACE_WITH_COLOR_CEILING_LAMP
            source: state
            ha_to_huawei:
              type: state_map
              map:
                "on": 1
                "off": 0
            huawei_to_ha:
              type: state_map
              map:
                "0": "off"
                "1": "on"

      - sid: brightness
        fields:
          brightness:
            entity_id: light.REPLACE_WITH_COLOR_CEILING_LAMP
            source: attribute
            attribute: brightness

      - sid: cct
        fields:
          colorTemperature:
            entity_id: light.REPLACE_WITH_COLOR_CEILING_LAMP
            source: attribute
            attribute: color_temp_kelvin

  living_room_rgbcw_driver:
    lifecycle:
      on_product_change: block
    display:
      friendly_name: "客厅 RGBCW 智能灯"
      room: "客厅"

    product:
      ref: ZG0O
      services:
        - st: subProduct
          sid: subProduct
        - st: switch
          sid: switch
        - st: brightness
          sid: brightness
        - st: cct
          sid: cct
        - st: colour
          sid: colour

    bindings:
      - sid: subProduct
        fields:
          subProductId:
            source: constant
            value: "05"

      - sid: switch
        fields:
          "on":
            entity_id: light.REPLACE_WITH_LIVING_ROOM_LIGHT
            source: state
            ha_to_huawei:
              type: state_map
              map:
                "on": 1
                "off": 0
            huawei_to_ha:
              type: state_map
              map:
                "0": "off"
                "1": "on"

      - sid: brightness
        fields:
          brightness:
            entity_id: light.REPLACE_WITH_LIVING_ROOM_LIGHT
            source: attribute
            attribute: brightness

      - sid: cct
        fields:
          colorTemperature:
            entity_id: light.REPLACE_WITH_LIVING_ROOM_LIGHT
            source: attribute
            attribute: color_temp_kelvin

      - sid: colour
        fields:
          red:
            entity_id: light.REPLACE_WITH_LIVING_ROOM_LIGHT
            source: attribute
            attribute: rgb_color
            component: red
          green:
            entity_id: light.REPLACE_WITH_LIVING_ROOM_LIGHT
            source: attribute
            attribute: rgb_color
            component: green
          blue:
            entity_id: light.REPLACE_WITH_LIVING_ROOM_LIGHT
            source: attribute
            attribute: rgb_color
            component: blue

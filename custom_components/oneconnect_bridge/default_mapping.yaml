# 这是每个网关首次添加时复制到其 .storage 目录的用户配置样例。
#
# 默认只注册一个用于验证链路的单品。它是普通用户子设备，用户可以删除；
# 删除后点击“重载子设备配置”，云端和本地材料会按普通子设备一起清理。
# identity、SN、UDID、devId 和认证材料由运行时生成并持久化，不写入这里。
#
# product 直接写在用户 YAML 中，不依赖集成内置产品目录：
# prod_id 对应 DeviceId，sub_prod_id 对应 subDeviceTypeId，
# device_type 对应 DeviceTypeId，manufacturer 对应 ManufacturerId。
# ZJ0V 的 protType=1；known_fields_only=true 时不发送 subProdId/setupType。
# fwv/hwv/swv 由集成 manifest 版本生成，不在用户 YAML 中配置。
#
# 用户新增实际设备时，复制 children 下的结构并填写自己的产品、服务和绑定。
# product.services 可以为空，但只适用于没有 bindings 的链路探针；普通实体映射必须选择服务。

schema: 1
enabled: true
gateway_serial: ""

children:
  oneconnect_link_probe:
    lifecycle:
      on_product_change: block
    display:
      friendly_name: "尊界S800 Grand Design"

    product:
      prod_id: ZJ0V
      sub_prod_id: ""
      device_type: "347"
      manufacturer: "002"
      model: "MAEXTRO-S800 Grand Design"
      device_name: "尊界S800 Grand Design"
      protocol_type: 1
      setup_type: 0
      known_fields_only: true
      services:
        - st: car.ignition
          sid: ignition

    bindings: []
